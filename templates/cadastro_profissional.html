{% extends "base.html" %}

{% block content %}

<div class="container mt-5 d-flex justify-content-center">
    <div id="cardCadastro"
        class="card shadow-lg border-0 p-4 {% if request.form.get('tipo', 'usuario') == 'profissional' %}bg-success-subtle{% else %}bg-primary-subtle{% endif %}"
        style="max-width: 750px; width: 100%; border-radius: 20px; transition: all 0.3s ease;">

        <!-- TÍTULO -->
        <h3 class="text-center mb-2 fw-bold">Criar Conta</h3>
        <p class="text-center text-muted mb-4">
            Escolha o tipo de cadastro para continuar
        </p>

        <!-- ABAS -->
        <ul class="nav nav-pills nav-justified mb-4">
            <li class="nav-item">
                <button type="button"
                    class="nav-link fw-semibold {% if request.form.get('tipo', 'usuario') == 'usuario' %}active text-primary{% else %}text-primary{% endif %}"
                    onclick="trocarTipo(event, 'usuario')">
                    👤 Usuário
                </button>
            </li>
            <li class="nav-item">
                <button type="button"
                    class="nav-link fw-semibold {% if request.form.get('tipo') == 'profissional' %}active text-success{% else %}text-success{% endif %}"
                    onclick="trocarTipo(event, 'profissional')">
                    🩺 Profissional
                </button>
            </li>
        </ul>

        <form method="POST">

            <!-- TIPO -->
            <input type="hidden" name="tipo" id="tipo" value="{{ request.form.get('tipo', 'usuario') }}">

            <!-- NOME -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" class="form-control"
                        value="{{ request.form.get('nome', nome or '') }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Sobrenome</label>
                    <input type="text" name="sobrenome" class="form-control"
                        value="{{ request.form.get('sobrenome', sobrenome or '') }}">
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                    value="{{ request.form.get('email', email or '') }}" required>
            </div>

            <!-- TELEFONE -->
            <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="text" name="telefone" id="telefone" class="form-control" placeholder="(14) 99999-9999"
                    value="{{ request.form.get('telefone', telefone or '') }}">
            </div>

            <!-- CEP -->
            <div class="mb-3">
                <label class="form-label">CEP</label>
                <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000"
                    value="{{ request.form.get('cep', cep or '') }}">
            </div>

            <!-- ENDEREÇO -->
            <div class="mb-3">
                <label class="form-label">Rua</label>
                <input type="text" id="rua" name="rua" class="form-control"
                    value="{{ request.form.get('rua', rua or '') }}">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Cidade</label>
                    <input type="text" id="cidade" name="cidade" class="form-control"
                        value="{{ request.form.get('cidade', cidade or '') }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Estado</label>
                    <select id="estado" name="estado" class="form-select">
                        <option value="">Selecione</option>

                        <option value="AC" {% if request.form.get('estado')=='AC' %}selected{% endif %}>Acre</option>
                        <option value="AL" {% if request.form.get('estado')=='AL' %}selected{% endif %}>Alagoas</option>
                        <option value="AP" {% if request.form.get('estado')=='AP' %}selected{% endif %}>Amapá</option>
                        <option value="AM" {% if request.form.get('estado')=='AM' %}selected{% endif %}>Amazonas
                        </option>
                        <option value="BA" {% if request.form.get('estado')=='BA' %}selected{% endif %}>Bahia</option>
                        <option value="CE" {% if request.form.get('estado')=='CE' %}selected{% endif %}>Ceará</option>
                        <option value="DF" {% if request.form.get('estado')=='DF' %}selected{% endif %}>Distrito Federal
                        </option>
                        <option value="ES" {% if request.form.get('estado')=='ES' %}selected{% endif %}>Espírito Santo
                        </option>
                        <option value="GO" {% if request.form.get('estado')=='GO' %}selected{% endif %}>Goiás</option>
                        <option value="MA" {% if request.form.get('estado')=='MA' %}selected{% endif %}>Maranhão
                        </option>
                        <option value="MT" {% if request.form.get('estado')=='MT' %}selected{% endif %}>Mato Grosso
                        </option>
                        <option value="MS" {% if request.form.get('estado')=='MS' %}selected{% endif %}>Mato Grosso do
                            Sul</option>
                        <option value="MG" {% if request.form.get('estado')=='MG' %}selected{% endif %}>Minas Gerais
                        </option>
                        <option value="PA" {% if request.form.get('estado')=='PA' %}selected{% endif %}>Pará</option>
                        <option value="PB" {% if request.form.get('estado')=='PB' %}selected{% endif %}>Paraíba</option>
                        <option value="PR" {% if request.form.get('estado')=='PR' %}selected{% endif %}>Paraná</option>
                        <option value="PE" {% if request.form.get('estado')=='PE' %}selected{% endif %}>Pernambuco
                        </option>
                        <option value="PI" {% if request.form.get('estado')=='PI' %}selected{% endif %}>Piauí</option>
                        <option value="RJ" {% if request.form.get('estado')=='RJ' %}selected{% endif %}>Rio de Janeiro
                        </option>
                        <option value="RN" {% if request.form.get('estado')=='RN' %}selected{% endif %}>Rio Grande do
                            Norte</option>
                        <option value="RS" {% if request.form.get('estado')=='RS' %}selected{% endif %}>Rio Grande do
                            Sul</option>
                        <option value="RO" {% if request.form.get('estado')=='RO' %}selected{% endif %}>Rondônia
                        </option>
                        <option value="RR" {% if request.form.get('estado')=='RR' %}selected{% endif %}>Roraima</option>
                        <option value="SC" {% if request.form.get('estado')=='SC' %}selected{% endif %}>Santa Catarina
                        </option>
                        <option value="SP" {% if request.form.get('estado')=='SP' %}selected{% endif %}>São Paulo
                        </option>
                        <option value="SE" {% if request.form.get('estado')=='SE' %}selected{% endif %}>Sergipe</option>
                        <option value="TO" {% if request.form.get('estado')=='TO' %}selected{% endif %}>Tocantins
                        </option>
                    </select>
                </div>
            </div>

            <!-- SENHA -->
            <div class="mb-3">
                <label>Senha</label>

                <div class="input-group">
                    <input type="password" name="senha" id="senha" class="form-control" required>

                    <button type="button" class="btn btn-outline-secondary" onclick="toggleSenha()">
                        <span id="iconeSenha">👁️</span>
                    </button>
                </div>
            </div>

            <!-- BOTÃO -->
            <button id="btnCadastro"
                class="btn {% if request.form.get('tipo') == 'profissional' %}btn-success{% else %}btn-primary{% endif %} w-100 py-2 fw-bold">
                Criar Conta
            </button>

        </form>

    </div>
</div>

<!-- JS -->
<script>
    function trocarTipo(e, tipoSelecionado) {
        document.getElementById("tipo").value = tipoSelecionado;

        const card = document.getElementById("cardCadastro");
        const btn = document.getElementById("btnCadastro");

        document.querySelectorAll(".nav-link").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");

        if (tipoSelecionado === "usuario") {
            card.classList.remove("bg-success-subtle");
            card.classList.add("bg-primary-subtle");

            btn.classList.remove("btn-success");
            btn.classList.add("btn-primary");
        } else {
            card.classList.remove("bg-primary-subtle");
            card.classList.add("bg-success-subtle");

            btn.classList.remove("btn-primary");
            btn.classList.add("btn-success");
        }
    }
</script>

<!-- TELEFONE -->
<script>
    document.getElementById("telefone").addEventListener("input", function (e) {
        let v = e.target.value.replace(/\D/g, "");

        if (v.length > 11) v = v.slice(0, 11);

        if (v.length > 6) {
            v = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
        } else if (v.length > 2) {
            v = `(${v.slice(0, 2)}) ${v.slice(2)}`;
        }

        e.target.value = v;
    });
</script>

<!-- CEP -->
<script>
    document.getElementById("cep").addEventListener("blur", function () {
        let cep = this.value.replace(/\D/g, '');

        if (cep.length !== 8) return;

        fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(res => res.json())
            .then(dados => {
                if (!dados.erro) {
                    document.getElementById("rua").value = dados.logradouro;
                    document.getElementById("cidade").value = dados.localidade;
                    document.getElementById("estado").value = dados.uf;
                }
            });
    });
</script>

<!-- MOSTRAR SENHA -->
<script>
    function toggleSenha() {
        let senha = document.getElementById("senha");
        let icone = document.getElementById("iconeSenha");

        if (senha.type === "password") {
            senha.type = "text";
            icone.textContent = "🙈";
        } else {
            senha.type = "password";
            icone.textContent = "👁️";
        }
    }
</script>

{% endblock %}
