<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Apoio Contra o Vício em Apostas{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Apoio & Consciência</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Início</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('todas_noticias') }}">Notícias</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('forum_home') }}">Fórum</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('ajuda') }}">Ajuda</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('bloqueio') }}">
                            Bloqueie Sites de Apostas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contato</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
