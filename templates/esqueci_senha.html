{% extends "base.html" %}
{% block title %}Recuperar Senha{% endblock %}
{% block content %}

<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">

    <div class="card shadow-lg border-0 p-5" style="max-width: 500px; width:100%; border-radius:20px;">

        <h3 class="text-center mb-3">Recuperar Senha</h3>

        <p class="text-muted text-center mb-4">
            Informe seu email para receber o link de redefinição.
        </p>

        <form method="POST">

            {{ csrf_token() }}

            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text">📧</span>
                    <input type="email" name="email" class="form-control" value="{{ email or '' }}"
                        placeholder="seu@email.com" required>
                </div>
            </div>

            <button class="btn btn-primary w-100">
                Enviar link de recuperação
            </button>

        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-decoration-none">
                Voltar para login
            </a>
        </div>

    </div>

</div>

{% endblock %}
