{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}


<div class="container-fluid d-flex align-items-center justify-content-center bg-light"
    style="min-height:80vh; padding:30px 0;">

    <div class="row shadow-lg" style="width: 900px; border-radius: 15px; overflow: hidden;">

        <!-- LADO ESQUERDO (ESTÉTICO) -->
        <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center text-white"
            style="background: linear-gradient(135deg, #0d6efd, #3a86ff);">

            <h2 class="mb-3">Bem-vindo de volta</h2>
            <p class="text-center px-4">
                Acesse sua conta e continue sua jornada com apoio e consciência.
            </p>
        </div>

        <!-- LADO DIREITO (FORM) -->
        <div class="col-md-6 bg-white p-5">

            <h3 class="mb-4 text-center">Login</h3>

            <form method="POST" action="{{ url_for('login') }}">

                <!-- EMAIL -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope-fill"></i>
                        </span>
                        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
                    </div>
                </div>

                <!-- SENHA -->
                <div class="mb-3">
                    <label class="form-label">Senha</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>

                        <input type="password" name="senha" id="senha" class="form-control" required>

                        <button type="button" class="btn btn-outline-secondary" onclick="toggleSenha()">
                            <i id="iconeSenha" class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- ESQUECI SENHA -->
                <div class="text-end mb-3">
                    <a href="{{ url_for('esqueci_senha') }}" class="text-decoration-none">
                        Esqueci minha senha
                    </a>
                </div>

                <!-- BOTÃO -->
                <button type="submit" class="btn btn-dark w-100 mt-2">
                    Entrar
                </button>

            </form>

            <!-- LINKS -->
            <div class="text-center mt-3">
                <small>
                    Não tem conta?
                    <a href="{{ url_for('escolher_cadastro') }}">
                        Cadastre-se
                    </a>
                </small>
            </div>

        </div>
    </div>

</div>

<script>
    function toggleSenha() {
        let senha = document.getElementById("senha");
        let icone = document.getElementById("iconeSenha");

        if (senha.type === "password") {
            senha.type = "text";
            icone.textContent = "🙈";
        } else {
            senha.type = "password";
            icone.textContent = "👁️";
        }
    }
</script>


{% endblock %}
