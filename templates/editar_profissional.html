{% extends "base.html" %}

{% block title %}Editar Profissional{% endblock %}

{% block content %}

<div class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Editar profissional</h2>

            <p class="text-muted mb-0">
                Altere os dados cadastrais e profissionais.
            </p>
        </div>

        <a href="{{ url_for(
            'detalhes_profissional_aprovado',
            profissional_id=profissional.profissional_id
        ) }}" class="btn btn-outline-secondary">
            Voltar
        </a>

    </div>


    <form method="POST">

        {{ csrf_token() }}

        <!-- DADOS PESSOAIS -->

        <div class="card border-0 shadow-sm mb-4">

            <div class="card-body">

                <h5 class="mb-4">
                    Dados pessoais
                </h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nome</label>

                        <input type="text" name="nome" class="form-control" value="{{ profissional.nome or '' }}"
                            required>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">Sobrenome</label>

                        <input type="text" name="sobrenome" class="form-control"
                            value="{{ profissional.sobrenome or '' }}" required>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">CPF</label>

                        <input type="text" name="cpf" class="form-control" value="{{ profissional.cpf or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Sexo</label>

                        <select name="sexo" class="form-select">
                            <option value="">Selecione</option>

                            <option value="Masculino" {% if profissional.sexo=="Masculino" %}selected{% endif %}>
                                Masculino
                            </option>

                            <option value="Feminino" {% if profissional.sexo=="Feminino" %}selected{% endif %}>
                                Feminino
                            </option>

                            <option value="Outro" {% if profissional.sexo=="Outro" %}selected{% endif %}>
                                Outro
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Data de nascimento</label>

                        <input type="date" name="data_nascimento" class="form-control"
                            value="{{ profissional.data_nascimento.strftime('%Y-%m-%d') if profissional.data_nascimento else '' }}">
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">E-mail</label>

                        <input type="email" name="email" class="form-control" value="{{ profissional.email or '' }}"
                            required>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">Telefone</label>

                        <input type="text" name="telefone" class="form-control"
                            value="{{ profissional.telefone or '' }}">
                    </div>

                </div>

            </div>

        </div>


        <!-- ENDEREÇO -->

        <div class="card border-0 shadow-sm mb-4">

            <div class="card-body">

                <h5 class="mb-4">
                    Endereço
                </h5>

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label">CEP</label>

                        <input type="text" name="cep" class="form-control" value="{{ profissional.cep or '' }}">
                    </div>


                    <div class="col-md-4">
                        <label class="form-label">Estado</label>

                        <input type="text" name="estado" class="form-control" value="{{ profissional.estado or '' }}">
                    </div>


                    <div class="col-md-4">
                        <label class="form-label">Cidade</label>

                        <input type="text" name="cidade" class="form-control" value="{{ profissional.cidade or '' }}">
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">Rua</label>

                        <input type="text" name="rua" class="form-control" value="{{ profissional.rua or '' }}">
                    </div>


                    <div class="col-md-2">
                        <label class="form-label">Número</label>

                        <input type="text" name="numero" class="form-control" value="{{ profissional.numero or '' }}">
                    </div>


                    <div class="col-md-4">
                        <label class="form-label">Bairro</label>

                        <input type="text" name="bairro" class="form-control" value="{{ profissional.bairro or '' }}">
                    </div>

                </div>

            </div>

        </div>


        <!-- DADOS PROFISSIONAIS -->

        <div class="card border-0 shadow-sm mb-4">

            <div class="card-body">

                <h5 class="mb-4">
                    Dados profissionais
                </h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">CRP</label>

                        <input type="text" name="crp" class="form-control" value="{{ profissional.crp or '' }}"
                            required>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">UF do CRP</label>

                        <input type="text" name="uf_crp" class="form-control" value="{{ profissional.uf_crp or '' }}"
                            required>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">Experiência</label>

                        <input type="number" name="experiencia" class="form-control"
                            value="{{ profissional.experiencia or '' }}" min="0">
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">Especialidade</label>

                        <input type="text" name="especialidade" class="form-control"
                            value="{{ profissional.especialidade or '' }}">
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">
                            Instituição de ensino
                        </label>

                        <input type="text" name="faculdade" class="form-control"
                            value="{{ profissional.faculdade or '' }}">
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">
                            Pós-graduação
                        </label>

                        <input type="text" name="pos" class="form-control" value="{{ profissional.pos or '' }}">
                    </div>


                    <div class="col-12">
                        <label class="form-label">
                            Biografia
                        </label>

                        <textarea name="biografia" class="form-control"
                            rows="5">{{ profissional.biografia or '' }}</textarea>
                    </div>

                </div>

            </div>

        </div>


        <!-- BOTÕES -->

        <div class="d-flex gap-2">

            <button type="submit" class="btn btn-primary">
                Salvar alterações
            </button>

            <a href="{{ url_for(
                    'detalhes_profissional_aprovado',
                    profissional_id=profissional.profissional_id
                ) }}" class="btn btn-outline-secondary">
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
