name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes Python (regras puras, sem banco)
        run: python -m unittest discover -s testes -v
      - name: Testes JavaScript (validação do cadastro)
        run: node --test testes/test_validacao_cadastro.js
        env:
          PYTHON: python
